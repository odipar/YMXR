# The Java suite and the Python rigs, run by hand, in parallel jobs: the
# suite but the matrix of thirty-two cores, the matrix in four jobs of
# eight cores, the three runs that read performance.md back, a job each,
# and the runs under Hatari. doc/tools.md 19.2 lists them.
name: test

# Off by default: no push and no pull request starts it. A caller starts
# it from the Actions tab, or with `gh workflow run test.yml`.
on:
  workflow_dispatch:

jobs:
  # A skipped test is a check that did not run, and a run that skips one
  # is green and asleep. bin/suite (doc/tools.md 19.6) requires what the
  # skipping tests need, reads gofmt -l go and runs go test beside them,
  # runs the suite and ends with 1 where the count is above 0. Here it
  # runs every test but the matrix of RigCallsTest, which the four jobs
  # of cores run.
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: the suite but the matrix of cores, and no skip
        run: bin/suite -Drig.shard=none

  # The matrix of RigCallsTest, the thirty-two cores, in four shards of
  # eight, and the eight sets of switches of linked players, two a shard.
  # RigCallsTest's theFourShardsAreEveryCoreOnce and
  # theFourShardsAreEverySetOfLinkedSwitchesOnce, in the suite job, read
  # that shards 0 to 3 of 4 are every core and every set, once each.
  cores:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: shard ${{ matrix.shard }} of 4 of the cores, and no skip
        run: >-
          bin/suite '-Dtest=RigCallsTest#theRigPlaysTheBuiltTunesOnEveryCore+theRigPlaysOnLinkedPlayersOfEverySetOfSwitches'
          -Drig.shard=${{ matrix.shard }}/4

  # performance.md's sentences over the whole set. -refill reads which
  # tunes fit the ring, a refill's cost outside and inside the decoder,
  # the ends of the fit, the three costs of a refill that parses no
  # operation, and each tune's bound tune and state block; -cycles -abs
  # reads the tables of the player whose ticks read a row through an
  # absolute address; -cycles -map reads the lookup's ticks, the remaps at
  # the frame and the cost of 34 columns.
  figures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: ['-refill', '-cycles -abs', '-cycles -map']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: test_ymxr.py ${{ matrix.run }} over the whole set
        run: python3 68k/test/emu/test_ymxr.py ${{ matrix.run }}

  # -stub and -hatari play the tunes on a real MFP, under Hatari. Its
  # version is pinned, built from its tag and kept between runs: the rig
  # reads Hatari's trace, whose lines 2.4.1, the version Ubuntu ships,
  # writes another way. TOS 2.06, the image a caller runs them under, is
  # Atari's; EmuTOS is free, and its PAL image boots the ST at the 50 Hz
  # the two modes require.
  hatari:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: /opt/hatari
          key: hatari-2.6.1-${{ runner.os }}
      - name: Hatari 2.6.1 and EmuTOS 1.4
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libsdl2-2.0-0
          if [ ! -x /opt/hatari/bin/hatari ]; then
              sudo apt-get install -y -q cmake libsdl2-dev zlib1g-dev
              git clone -q --depth 1 --branch v2.6.1 https://github.com/hatari/hatari /tmp/hatari
              cmake -S /tmp/hatari -B /tmp/hatari/build -DCMAKE_BUILD_TYPE=Release > /dev/null
              cmake --build /tmp/hatari/build -j4 --target hatari > /dev/null
              sudo mkdir -p /opt/hatari/bin
              sudo cp /tmp/hatari/build/src/hatari /opt/hatari/bin/
          fi
          /opt/hatari/bin/hatari --version | head -2
          echo "HATARI=/opt/hatari/bin/hatari" >> "$GITHUB_ENV"
          curl -fsSL -o /tmp/emutos.zip \
            https://downloads.sourceforge.net/project/emutos/emutos/1.4/emutos-192k-1.4.zip
          echo "59abac06a2d29b0864c5a7cfb2af65f022c337aed34188e174a9a08cc737e4bc  /tmp/emutos.zip" \
            | sha256sum -c
          unzip -o -q /tmp/emutos.zip -d /tmp/emutos
          echo "TOS=/tmp/emutos/emutos-192k-1.4/etos192uk.img" >> "$GITHUB_ENV"
      - name: the tunes on Hatari's MFP
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python3 68k/test/emu/test_ymxr.py -stub
          python3 68k/test/emu/test_ymxr.py -hatari
          python3 68k/test/emu/test_ymxr.py -clock
          python3 68k/test/emu/test_ymxr.py -cost
      - name: the patched displacement read under Hatari
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 68k/test/emu/test_ymxr.py -xpatch
