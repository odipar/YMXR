# The Java suite, run by hand. The Python rigs under 68k/test/emu stand
# outside it but for the one RigCallsTest drives; doc/tools.md lists them.
name: test

# Off by default: no push and no pull request starts it. A caller starts
# it from the Actions tab, or with `gh workflow run test.yml`.
on:
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # The build assembles the nine binaries of BINARIES.md at
      # process-classes, eight cores and the program stub, and
      # BinariesTest reads the copies under go/binaries/data against that
      # assembly. The version is pinned: another rmac writes other bytes
      # and a red run.
      - name: rmac 2.4.3
        run: |
          curl -fsSL -o /tmp/rmac.zip \
            https://rmac.is-slick.com/static/rmac-2.4.3-lin-x64.zip
          unzip -j -o /tmp/rmac.zip -d /tmp/rmac
          sudo install -m 755 /tmp/rmac/rmac /usr/local/bin/rmac
      # RigCallsTest plays the built tunes on the 68000 player under
      # emulation, which wants unicorn.
      - run: python3 -m pip install --quiet unicorn
      # This tree resolves DTX and YMXS out of the local repository
      # alone, since pom.xml names no <repositories>: both are built here
      # at the release pom.xml requires, read from pom.xml so the two
      # cannot drift. DTX assembles its images, so rmac stands above this.
      - name: DTX and YMXS at the releases pom.xml requires
        run: |
          dtx=$(grep -A1 '<artifactId>dtx</artifactId>' pom.xml \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          ymxs=$(grep -A1 '<artifactId>ymxs</artifactId>' pom.xml \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "DTX $dtx, YMXS $ymxs"
          git clone --depth 1 --branch "v$dtx" \
              https://github.com/odipar/DTX "$RUNNER_TEMP/DTX"
          git clone --depth 1 --branch "v$ymxs" \
              https://github.com/odipar/YMXS "$RUNNER_TEMP/YMXS"
          mvn -B -q --no-transfer-progress -f "$RUNNER_TEMP/DTX" install -DskipTests
          mvn -B -q --no-transfer-progress -f "$RUNNER_TEMP/YMXS" install -DskipTests
          # RigCallsTest reads the packer DTX_WRITE names, and counts a
          # tune on the rig of the checkout DTX_REPO names (doc/tools.md).
          echo "DTX_WRITE=$RUNNER_TEMP/DTX/bin/dtx-write" >> "$GITHUB_ENV"
          echo "DTX_REPO=$RUNNER_TEMP/DTX" >> "$GITHUB_ENV"
      # ParityTest runs the two trees against one another and skips where
      # go is absent, so a runner without it is green and asleep.
      - run: go version && rmac | sed -n '7p' && "$DTX_WRITE" -help | head -1
      # A skipped test is a check that did not run, and a run that skips
      # one is green and asleep. bin/suite (doc/tools.md 19.6) requires
      # what the skipping tests need, reads gofmt -l go beside them, runs
      # the suite and ends with 1 where the count is above 0; a caller
      # runs the same script here.
      - name: the suite, and no skip
        run: bin/suite
      # performance.md's sentences over the whole set are read back by a
      # run of -refill over the eleven fixtures whole: which tunes fit the
      # ring, a refill's cost outside and inside the decoder, the ends of
      # the fit, and the 44 between the two costs of a refill that parses
      # no operation. RigCallsTest runs one tune of the set; this runs all
      # of them, a few minutes the suite leaves to this step.
      - name: performance.md over the whole set
        run: python3 68k/test/emu/test_ymxr.py -refill
      # -stub and -hatari play the tunes on a real MFP, under Hatari. Its
      # version is pinned, built from its tag and kept between runs: the rig
      # reads Hatari's trace, whose lines 2.4.1, the version Ubuntu carries,
      # writes another way. TOS 2.06, the image a caller runs them under,
      # is Atari's; EmuTOS is free, and its PAL image boots the ST at the
      # 50 Hz the two modes require.
      - uses: actions/cache@v4
        with:
          path: /opt/hatari
          key: hatari-2.6.1-${{ runner.os }}
      - name: Hatari 2.6.1 and EmuTOS 1.4
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libsdl2-2.0-0
          if [ ! -x /opt/hatari/bin/hatari ]; then
              sudo apt-get install -y -q cmake libsdl2-dev zlib1g-dev
              git clone -q --depth 1 --branch v2.6.1 https://github.com/hatari/hatari /tmp/hatari
              cmake -S /tmp/hatari -B /tmp/hatari/build -DCMAKE_BUILD_TYPE=Release > /dev/null
              cmake --build /tmp/hatari/build -j4 --target hatari > /dev/null
              sudo mkdir -p /opt/hatari/bin
              sudo cp /tmp/hatari/build/src/hatari /opt/hatari/bin/
          fi
          /opt/hatari/bin/hatari --version | head -2
          echo "HATARI=/opt/hatari/bin/hatari" >> "$GITHUB_ENV"
          curl -fsSL -o /tmp/emutos.zip \
            https://downloads.sourceforge.net/project/emutos/emutos/1.4/emutos-192k-1.4.zip
          echo "59abac06a2d29b0864c5a7cfb2af65f022c337aed34188e174a9a08cc737e4bc  /tmp/emutos.zip" \
            | sha256sum -c
          unzip -o -q /tmp/emutos.zip -d /tmp/emutos
          echo "TOS=/tmp/emutos/emutos-192k-1.4/etos192uk.img" >> "$GITHUB_ENV"
      - name: the tunes on Hatari's MFP
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python3 68k/test/emu/test_ymxr.py -stub
          python3 68k/test/emu/test_ymxr.py -hatari
